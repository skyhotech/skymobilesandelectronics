  /api/v1/management/products/:
    get:
      operationId: management_products_list
      parameters:
      - in: query
        name: brand
        schema:
          type: integer
          minimum: 1
        description: Limit reads and writes to this brand. Supplied product brands
          must match.
      - in: query
        name: category
        schema:
          type: integer
          minimum: 1
      - in: query
        name: max_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      - in: query
        name: min_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      - in: query
        name: ordering
        schema:
          enum:
          - name
          - -name
          - price
          - -price
          - -id
          type: string
          default: name
          minLength: 1
        description: |-
          * `name` - name
          * `-name` - -name
          * `price` - price
          * `-price` - -price
          * `-id` - -id
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          enum:
          - all
          - active
          - inactive
          type: string
          default: all
          minLength: 1
        description: |-
          * `all` - all
          * `active` - active
          * `inactive` - inactive
      tags:
      - management
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: management_products_create
      parameters:
      - in: query
        name: brand
        schema:
          type: integer
          minimum: 1
        description: Limit reads and writes to this brand. Supplied product brands
          must match.
      tags:
      - management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/management/products/{id}/:
    get:
      operationId: management_products_retrieve
      parameters:
      - in: query
        name: brand
        schema:
          type: integer
          minimum: 1
        description: Limit reads and writes to this brand. Supplied product brands
          must match.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - management
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    put:
      operationId: management_products_update
      parameters:
      - in: query
        name: brand
        schema:
          type: integer
          minimum: 1
        description: Limit reads and writes to this brand. Supplied product brands

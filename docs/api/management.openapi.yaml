components:
  schemas:
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        is_active:
          type: boolean
        logo_url:
          type: string
      required:
      - id
      - name
      - slug
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        parent:
          type: integer
          nullable: true
        parent_name:
          type: string
          readOnly: true
          default: ''
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        is_active:
          type: boolean
        image_url:
          type: string
        badge:
          type: string
          maxLength: 40
        description:
          type: string
          maxLength: 240
        starting_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        destination:
          $ref: '#/components/schemas/DestinationEnum'
        display_order:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        show_on_homepage:
          type: boolean
      required:
      - id
      - name
      - parent_name
      - slug
    CategoryMove:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        parent:
          type: integer
          minimum: 1
          nullable: true
        before:
          type: integer
          minimum: 1
          nullable: true
        revision:
          type: integer
          minimum: 0
      required:
      - id
      - parent
      - revision
    CategoryRevision:
      type: object
      properties:
        revision:
          type: integer
      required:
      - revision
    CategoryTree:
      type: object
      properties:
        revision:
          type: integer
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/PublicCategory'
      required:
      - nodes
      - revision
    CategoryUpload:
      type: object
      properties:
        file:
          type: string
          format: uri
      required:
      - file
    CurrencyEnum:
      enum:
      - INR
      type: string
      description: '* `INR` - Indian Rupee'
    DestinationEnum:
      enum:
      - '#smartphones'
      - '#laptops'
      - '#gadgets'
      - '#entertainment'
      type: string
      description: |-
        * `#smartphones` - Smartphones
        * `#laptops` - Laptops & tablets
        * `#gadgets` - Gadgets & audio
        * `#entertainment` - TVs & appliances
    KindEnum:
      enum:
      - products
      - brands
      - categories
      - banners
      - other
      type: string
      description: |-
        * `products` - Product
        * `brands` - Brand
        * `categories` - Category
        * `banners` - Banner
        * `other` - Other
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 1024
      required:
      - password
      - username
    ManagementCategoryTree:
      type: object
      properties:
        revision:
          type: integer
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
      - nodes
      - revision
    ManagementError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ManagementSession:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/ManagementUser'
          nullable: true
        csrfToken:
          type: string
      required:
      - csrfToken
      - user
    ManagementUser:
      type: object
      properties:
        username:
          type: string
      required:
      - username
    MediaAsset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        file_name:
          type: string
          readOnly: true
        image_url:
          type: string
          readOnly: true
        thumbnail_url:
          type: string
          readOnly: true
        width:
          type: integer
          readOnly: true
        height:
          type: integer
          readOnly: true
        total_bytes:
          type: integer
          readOnly: true
        original_bytes:
          type: integer
          readOnly: true
        sha256:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        is_archived:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - file_name
      - height
      - id
      - image_url
      - is_archived
      - kind
      - original_bytes

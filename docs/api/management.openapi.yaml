        '204':
          description: No response body
  /api/v1/management/media/{id}/original/:
    get:
      operationId: management_media_original_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this media asset.
        required: true
      tags:

      - in: query
        name: search
        schema:
          type: string
          maxLength: 120
      tags:
      - products
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogProductList'
          description: ''
  /api/v1/products/{slug}/:
    get:
      operationId: products_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - products
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProduct'
          description: ''
  /api/v1/products/filters/options/:
    get:
      operationId: products_filters_options_retrieve
      tags:
      - products
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductFilterOptions'
          description: ''
components:
  schemas:
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        is_active:
          type: boolean
        logo_url:
          type: string
        show_on_homepage:
          type: boolean

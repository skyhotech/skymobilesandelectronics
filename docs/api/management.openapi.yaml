  /api/v1/products/:
    get:
      operationId: products_list
      parameters:
      - in: query
        name: brand
        schema:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
          minLength: 1
      - in: query
        name: category
        schema:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
          minLength: 1
      - in: query
        name: max_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      - in: query
        name: min_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      - in: query
        name: ordering

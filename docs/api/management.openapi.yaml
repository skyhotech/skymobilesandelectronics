      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: management_products_partial_update
      parameters:
      - in: query
        name: brand
        schema:
          type: integer
          minimum: 1
        description: Limit reads and writes to this brand. Supplied product brands
          must match.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    delete:
      operationId: management_products_destroy
      parameters:
      - in: query
        name: brand
        schema:
          type: integer
          minimum: 1
        description: Limit reads and writes to this brand. Supplied product brands
          must match.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - management
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/management/search/:
    get:
      operationId: management_search_retrieve

# Local HTTP only. Production uses production.conf.template and approved TLS.
server {
    listen 8080;
    server_name localhost;
    location ~* ^/media/(?<public_file>(?:products|brands|categories|banners|other|thumbnails)/[a-z0-9_./-]+\.(?:webp|png|jpg|jpeg|avif))$ {
        alias /srv/media/$public_file;
        disable_symlinks on;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }
    location / { return 404; }
}

components:
  schemas:
    Audit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          maxLength: 40
        status:
          type: string
          maxLength: 32
        note:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor_name:
          type: string
          readOnly: true
          default: System
      required:
      - action
      - actor_name
      - created_at
      - id
      - status
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        code:
          type: string
          maxLength: 40
          pattern: ^[-a-zA-Z0-9_]+$
        city:
          type: string
          maxLength: 100
        address:
          type: string
        phone:
          type: string
          maxLength: 24
        google_maps_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 2000
          - type: string
            maxLength: 0
        street_view_embed_url:
          type: string
          maxLength: 12000
        is_active:
          type: boolean
        imagery_date:
          type: string
          readOnly: true
        location_embed_url:
          type: string
          readOnly: true
        branch_id:
          type: string
          readOnly: true
        is_showroom:
          type: boolean
        google_place_id:
          type: string
          nullable: true
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,7})?$
          nullable: true
        location_verified:
          type: boolean
        manual_override:
          type: boolean
        street_view_enabled:
          type: boolean
        street_view_status:
          allOf:
          - $ref: '#/components/schemas/StreetViewStatusEnum'
          readOnly: true
        street_view_verified:
          type: boolean
          readOnly: true
        panorama_id:
          type: string
          readOnly: true
        panorama_latitude:
          type: number
          format: double
          readOnly: true
          nullable: true
        panorama_longitude:
          type: number
          format: double
          readOnly: true
          nullable: true
        panorama_distance_m:
          type: number
          format: double
          readOnly: true
          nullable: true
        heading:
          type: number
          format: double
          maximum: 360
          minimum: 0
        pitch:
          type: number
          format: double
          maximum: 90
          minimum: -90
        last_checked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        location_candidates:
          readOnly: true
        sync_error:
          type: string
          readOnly: true
        street_view_preview_url:
          type: string
          readOnly: true
        google_data_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        location_source:
          type: string
          readOnly: true
      required:
      - branch_id
      - code
      - google_data_expires_at
      - id
      - imagery_date
      - last_checked_at
      - last_verified_at
      - location_candidates
      - location_embed_url
      - location_source
      - name
      - panorama_distance_m
      - panorama_id
      - panorama_latitude
      - panorama_longitude
      - street_view_preview_url
      - street_view_status
      - street_view_verified
      - sync_error
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:

        schema:
          type: string
          enum:
          - available_nearby
          - error
          - needs_review
          - pending
          - storefront_verified
          - unavailable
        description: |-
          * `pending` - pending
          * `needs_review` - needs review
          * `available_nearby` - available nearby
          * `storefront_verified` - storefront verified
          * `unavailable` - unavailable
          * `error` - error

[project]
name = "sky-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

name: sky-platform-dev
services:
  nginx-media:
    profiles: [app]
    image: nginx:stable-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./infrastructure/nginx/media.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/media:/srv/media:ro
    restart: unless-stopped
  backend:
    profiles: [app]
    build: ./backend
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/1
      MEDIA_ROOT: /app/media
      PRIVATE_MEDIA_ROOT: /app/private-media
    volumes:
      - ./backend:/app
      - ./data/media:/app/media
      - ./data/private-media:/app/private-media
      - ./frontend/public/images/homepage/categories-v2:/app/bundled-category-artwork:ro
    ports: ["127.0.0.1:8000:8000"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_cs", "--default-storage-engine=InnoDB", "--sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Required}
      MYSQL_USER: ${MYSQL_USER:?Required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 384m
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  mysql_data:
  redis_data:
